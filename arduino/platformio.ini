; PlatformIO project for the Sipeed Maix Amigo (Kendryte K210)
; The board definition lives in boards/sipeed-maix-amigo.json, since the
; kendryte210 platform doesn't ship one for the Amigo.
;
; Apps, one per folder in src/:
;   lora  (default)  pio run -t upload
;   paint            pio run -e paint -t upload
;   sdcard           pio run -e sdcard -t upload
;   gps              pio run -e gps -t upload    (untested)

[platformio]
default_envs = lora

[env]
platform = kendryte210
board = sipeed-maix-amigo
framework = arduino
upload_protocol = kflash
monitor_speed = 115200
; DTR/RTS drive the K210's RESET and BOOT pins: keep them released, or the
; monitor holds the board in reset or in the ISP bootloader.
monitor_dtr = 0
monitor_rts = 0
; The packaged framework-maixduino (0.3.9) has no Amigo variant; use upstream.
platform_packages =
    framework-maixduino @ https://github.com/sipeed/Maixduino.git

; LoRa tester for the SP-LoRa (SX1276) module, ported from LoRa_Tester.py
[env:lora]
build_src_filter = +<lora/>
lib_deps =
    jgromes/RadioLib @ 7.8.1

; Touch paint demo for the display and touch drivers
[env:paint]
build_src_filter = +<paint/>

; SD card demo for the TF slot
[env:sdcard]
build_src_filter = +<sdcard/>

; GPS status screen, GPS on the Grove port (untested: no module tried yet)
[env:gps]
build_src_filter = +<gps/>
lib_deps =
    mikalhart/TinyGPSPlus @ 1.1.0
